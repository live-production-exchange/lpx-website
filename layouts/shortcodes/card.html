<div class="card h-100 shadow-sm hover-card" style="border-radius: 12px; border: 1px solid var(--bs-border-color);">
    <div class="card-body">
        <h5 class="card-title text-primary d-flex align-items-center">
            {{ if .Get "icon" }}<i class="bi bi-{{ .Get "icon" }} me-2 fs-4"></i>{{ end }}
            {{ .Get "title" }}
        </h5>
        <div class="card-text mt-3">{{ .Inner | markdownify }}</div>
    </div>
</div>

<header class="navbar navbar-expand-lg bd-navbar sticky-top bg-body-tertiary border-bottom">
  <div class="container-xxl">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <!-- Can place SVG logo here -->
      <span class="fw-semibold ms-2">Live Production Exchange</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse" data-bs-target="#bdNavbar" aria-controls="bdNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="bdNavbar">
      <ul class="navbar-nav flex-row flex-wrap bd-navbar-nav pt-2 py-md-0">
        <li class="nav-item col-6 col-md-auto">
          <a class="nav-link p-2 active" aria-current="page" href="/">Docs</a>
        </li>
      </ul>
      
      <hr class="d-md-none text-white-50">
      
      <ul class="navbar-nav flex-row flex-wrap ms-md-auto">
        <!-- Search placeholder -->
        <li class="nav-item col-12 col-lg-auto me-3 py-2 py-lg-0">
          <div id="search" class="d-none d-lg-block"></div>
        </li>
        
        <!-- Version Dropdown -->
        {{ if not .IsHome }}
        <li class="nav-item dropdown">
          <button class="btn btn-link nav-link py-2 px-0 px-lg-2 dropdown-toggle d-flex align-items-center" id="bd-versions" type="button" aria-expanded="false" data-bs-toggle="dropdown" data-bs-display="static">
            <span class="d-none d-lg-block">
              {{ $firstDir := index (split (strings.TrimPrefix "/" .RelPermalink) "/") 0 }}
              {{ if eq $firstDir "1.0" }}v1.0 (dpp){{ else }}Latest - 2.0{{ end }}
            </span>
            <span class="d-lg-none">Versions</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-versions">
            <li><a class="dropdown-item" href="/2.0/">Latest - 2.0</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="/1.0/introduction/why/">v1.0 (dpp)</a></li>
          </ul>
        </li>
        {{ end }}

        <li class="nav-item col-6 col-lg-auto">
          <a class="nav-link py-2 px-0 px-lg-2" href="{{ .Site.Params.github }}" target="_blank" rel="noopener">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            <span class="d-lg-none ms-2">GitHub</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
